# Stack Swarm/Portainer do WaCalls.
#
# Usa rede de host para que a mídia VoIP (UDP) chegue direto na pilha de rede da
# máquina, sem passar pela bridge. Por isso não há WACALLS_PUBLIC_IP nem publicação
# de faixa UDP aqui: o container enxerga os endereços reais do host.
#
# Como o serviço fica na rede de host, ele não está na network_public onde o Traefik
# roteia — daí o serviço `proxy` abaixo, que faz a ponte.
version: "3.8"

services:
  wacalls:
    image: astraonline/astracalls:v0.0.4
    environment:
      # Em container é obrigatório: o binário sozinho escuta em 127.0.0.1, que
      # dentro do container é inalcançável de fora e não gera erro nenhum.
      - WACALLS_ADDR=:8080
      - WACALLS_STATIC=/app/client/dist

      # Credenciais das contas do WhatsApp + gravações. Precisam do volume abaixo,
      # senão todo redeploy exige parear tudo por QR de novo.
      - WACALLS_DB=/data/wacalls.db
      - WACALLS_RECORD_DIR=/data/recordings

      # O que o navegador apresenta em ?token=... TROQUE.
      - WACALLS_TOKEN=troque-este-token

      # Credencial para sistemas externos (header X-API-Key), no formato nome:segredo,
      # separadas por vírgula. Opcional — remova se só for usar pelo navegador.
      - WACALLS_API_KEY=crm:troque-esta-chave

      # Ligações simultâneas por sessão (0 = ilimitado).
      - WACALLS_MAX_CALLS_PER_SESSION=8

      # Seu domínio, não '*'. Vazio = apenas same-origin, que já basta quando o
      # client é servido pelo próprio serviço.
      # - WACALLS_ALLOW_ORIGIN=https://seudominio.com.br
    volumes:
      - wacalls_data:/data
    networks:
      - hostnet
    deploy:
      mode: replicated
      # Não aumente: cada réplica abriria o mesmo SQLite no volume, disputaria as
      # mesmas portas UDP e manteria seu próprio estado de sessão/SSE.
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  proxy:
    image: alpine/socat
    command: "TCP4-LISTEN:8080,fork,reuseaddr TCP4:host.docker.internal:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - network_public
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.wacalls.rule=Host(`seudominio.com.br`)"
        - "traefik.http.routers.wacalls.entrypoints=websecure"
        - "traefik.http.routers.wacalls.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.wacalls.loadbalancer.server.port=8080"

networks:
  hostnet:
    external: true
    name: host
  network_public:
    external: true
    name: network_public

volumes:
  wacalls_data:
    name: wacalls_data
